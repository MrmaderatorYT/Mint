[versions]
agp = "8.11.1"
# NDK r28 is the first release that aligns shared libraries to 16 KB pages by
# default, which Play now requires. Keep this pinned so every machine and CI
# runner produces byte-comparable .so files.
ndk = "28.2.13676358"
cmake = "3.22.1"

junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.9.3"
fragment = "1.8.5"
constraintlayout = "2.2.1"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
documentfile = "1.0.1"
annotation = "1.9.1"
preference = "1.2.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
