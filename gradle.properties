org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Connected tests must not uninstall Mint (and erase private user projects).
android.injected.androidTest.leaveApksInstalledAfterRun=true
android.experimental.testOptions.uninstallIncompatibleApks=false

# The native build is the long pole; let it use the machine.
android.native.buildOutput=verbose

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
